<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Touch Ltd | Scheduled Maintenance</title>
    
    <!-- Premium Google Fonts: Playfair Display for headings, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --charcoal-dark: #121417; /* Deepest background */
            --charcoal-card: #1C1E21; /* Elevated card */
            --amber: #F5A623;         /* Vision Touch Amber */
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--charcoal-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            line-height: 1.6;
        }

        .maintenance-card {
            max-width: 600px;
            background: var(--charcoal-card);
            padding: 4rem 3rem;
            border-top: 4px solid var(--amber);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: fadeIn 0.8s ease-out forwards;
        }

        .brand-name {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            color: var(--amber);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: block;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--text-main);
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        h1 span {
            color: var(--amber);
            font-style: italic;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .contact-section {
            margin-top: 2.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-section p {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .contact-link {
            color: var(--amber);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: opacity 0.3s ease;
        }

        .contact-link:hover {
            opacity: 0.8;
        }

        /* Subtle ambient pulsing loader */
        .loader {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(245, 166, 35, 0.2);
            border-radius: 50%;
            border-top-color: var(--amber);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 2rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .maintenance-card { padding: 3rem 1.5rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="loader"></div>
        <span class="brand-name">Vision Touch Ltd</span>
        
        <h1>Laying new <span>foundations.</span></h1>
        
        <p>Our website is currently undergoing scheduled maintenance to upgrade our digital infrastructure. We are actively working behind the scenes and will be back online shortly.</p>
        
    </div>

</body>
</html>
